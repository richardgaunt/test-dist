name: Publish Pre-release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHA_BOT_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Verify package contents
        run: |
          # Expected directories
          EXPECTED_DIR="test2"

          failed=0
          for pkg in test-dist1 test-dist2; do
            echo "=== Verifying @richardgaunt/$pkg package contents ==="
            npm pack --workspace=packages/$pkg --quiet
            tarball=$(ls -t richardgaunt-$pkg-*.tgz | head -1)

            # Get expected dirs for this package
            expected_dirs="${EXPECTED_DIR}"

            # Check each directory
            missing_dirs=""
            for dir in $expected_dirs; do
              if tar -tzf "$tarball" | grep -q "^package/${dir}/"; then
                echo "✅ $dir"
              else
                echo "❌ $dir (MISSING)"
                missing_dirs="$missing_dirs $dir"
                failed=1
              fi
            done

            rm -f "$tarball"

            if [ -n "$missing_dirs" ]; then
              echo "❌ Package $pkg is missing required directories:$missing_dirs"
            else
              echo "✅ Package $pkg contains all required directories"
            fi
            echo ""
          done

          if [ $failed -eq 1 ]; then
            echo "❌ Package verification failed!"
            exit 1
          fi


      - name: Set pre-release version
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          # Extract major, minor, and patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Increment minor version for next release
          NEXT_MINOR=$((MINOR + 1))
          DEV_VERSION="${MAJOR}.${NEXT_MINOR}.0-dev"

          echo "DEV_VERSION=${DEV_VERSION}" >> ${GITHUB_ENV}

          # Update versions in all packages
          npm version ${DEV_VERSION} --no-git-tag-version --allow-same-version
          npm version ${DEV_VERSION} --no-git-tag-version --allow-same-version --workspace=packages/test-dist1
          npm version ${DEV_VERSION} --no-git-tag-version --allow-same-version --workspace=packages/test-dist2

      - name: Publish @richardgaunt/test-dist1 package
        working-directory: packages/test-dist1
        run: npm publish --verbose --access public --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_BOT_PAT }}

      - name: Publish @richardgaunt/test-dist2 package
        working-directory: packages/test-dist2
        run: npm publish --verbose --access public --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_BOT_PAT }}

      - name: Report dev version publish
        run: |
          echo "✅ Published dev pre-release packages:"
          echo "  - @richardgaunt/test-dist1@${DEV_VERSION}"
          echo "  - @richardgaunt/test-dist2@${DEV_VERSION}"
          echo ""
          echo "These packages can be installed with:"
          echo "npm install @richardgaunt/test-dist1@dev"
          echo "npm install @richardgaunt/test-dist2@dev"
